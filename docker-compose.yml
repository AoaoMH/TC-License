services:
  license-server:
    build: .
    container_name: license-server
    restart: unless-stopped
    # 仅绑定宿主机 127.0.0.1，由 1Panel / 宝塔面板 Nginx 反向代理暴露 HTTPS
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
